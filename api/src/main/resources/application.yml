spring:
  application.name: ship-hdmap-api
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/shiphdmap
    username: shiphdmap
    password: ${DB_PASSWORD:shiphdmap}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: false   # POST /seed accepts a full fixture (schema, map_id ... are ignored)
server.port: ${API_PORT:8081}
