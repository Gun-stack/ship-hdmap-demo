services:
  postgis:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: shiphdmap
      POSTGRES_USER: shiphdmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiphdmap}
    ports: ["127.0.0.1:5433:5432"]   # 5432 is taken by another local project
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiphdmap -d shiphdmap"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
